spring.application.name=clothing-ecommerce
server.port=8080
spring.profiles.active=dev

# CORS Settings
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Multipart Upload Limits (for Knowledge Base PDFs up to 15MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# AI & RAG Configuration
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}
rag.top-k=${RAG_TOP_K:4}

# Google OAuth 2.0 Configuration (Configured via Environment Variables)
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.authorized-redirect-url=${OAUTH2_REDIRECT_URL:http://localhost:5173/login}

# JWT Authentication
jwt.secret=${JWT_SECRET:clothing_super_secret_jwt_key_that_is_at_least_256_bits_long_for_security_2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

