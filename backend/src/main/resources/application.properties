spring.application.name=clothing-ecommerce
server.port=8080
spring.profiles.active=dev

# CORS Settings
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Multipart Upload Limits (for Knowledge Base PDFs up to 15MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# AI & RAG Configuration
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}
rag.top-k=${RAG_TOP_K:4}
